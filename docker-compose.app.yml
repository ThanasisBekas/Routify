# docker-compose.app.yml — Routify Application Services
# Usage: docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
#
# Prerequisites:
#   1. Run `mvn clean package -DskipTests` to build all JARs.
#   2. Copy env.example → .env and fill in all required values.
#
# ⚠  DEV / LOCAL USE ONLY.
#    All secrets below are resolved from environment variables.
#    Copy env.example → .env and supply real values before starting.

services:

  identity-service:
    build:
      context: ./routify-identity-service
      dockerfile: Dockerfile
    container_name: routify-identity
    ports:
      - "8083:8083"
      - "9083:9083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/routify
      DB_HOST: postgres
      DB_USER: routify
      DB_PASS: ${DB_PASS}
      KAFKA_BOOTSTRAP: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      REDIS_HOST: redis
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [routify]

  route-service:
    build:
      context: ./routify-route-service
      dockerfile: Dockerfile
    container_name: routify-route
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      DB_HOST: postgres
      DB_USER: routify
      DB_PASS: ${DB_PASS}
      KAFKA_BOOTSTRAP: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      REDIS_HOST: redis
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [routify]

  audit-service:
    build:
      context: ./routify-audit-service
      dockerfile: Dockerfile
    container_name: routify-audit
    ports:
      - "8084:8084"
      - "9084:9084"
    environment:
      DB_HOST: postgres
      DB_USER: routify
      DB_PASS: ${DB_PASS}
      KAFKA_BOOTSTRAP: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      ROUTIFY_REPLAY_GATEWAY_BASE_URL: http://api-gateway:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [routify]

  cert-vault:
    build:
      context: ./routify-cert-vault
      dockerfile: Dockerfile
    container_name: routify-cert-vault
    ports:
      - "8085:8085"
      - "9085:9085"
    environment:
      DB_HOST: postgres
      DB_USER: routify
      DB_PASS: ${DB_PASS}
      KAFKA_BOOTSTRAP: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CERT_VAULT_ENCRYPTION_KEY: ${CERT_VAULT_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [routify]

  admin-api:
    build:
      context: ./routify-admin-api
      dockerfile: Dockerfile
    container_name: routify-admin-api
    ports:
      - "8082:8082"
      - "9082:9082"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      REDIS_HOST: redis
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      identity-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [routify]

  api-gateway:
    build:
      context: ./routify-api-gateway
      dockerfile: Dockerfile
    container_name: routify-gateway
    ports:
      - "8080:8080"
      - "9080:9080"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      SPRING_DATA_REDIS_HOST: redis
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      AI_SERVICE_URL: http://ai-service:8086
    depends_on:
      route-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [routify]

  ai-service:
    build:
      context: ./routify-ai-service
      dockerfile: Dockerfile
    container_name: routify-ai-service
    ports:
      - "8086:8086"
      - "9086:9086"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      REDIS_HOST: redis
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      # Ollama runs as a separate container in the same Docker network.
      OLLAMA_BASE_URL: http://ollama:11434
      # Override model with e.g. OLLAMA_MODEL=phi4-mini:3.8b-instruct-q4_K_M
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b-instruct-q8_0}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-5}
      AI_FALLBACK_ACTION: ${AI_FALLBACK_ACTION:-ALLOW}
      RABBITMQ_CONCURRENCY: ${RABBITMQ_CONCURRENCY:-4}
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [routify]

  # ─── Ollama — Local LLM Inference Server ────────────────────────────────────
  # Serves any GGUF/GGML model via OpenAI-compatible HTTP API on port 11434.
  #
  # CPU-only: use the standard image (default below).
  # GPU (NVIDIA): add `deploy.resources.reservations.devices` with driver=nvidia.
  #   See: https://hub.docker.com/r/ollama/ollama — GPU section.
  #
  # Model is pulled on first start by the ai-service's pull-model-strategy=when_missing.
  # To pre-pull in the image (recommended for production):
  #   docker exec routify-ollama ollama pull qwen2.5:1.5b-instruct-q8_0
  #
  # Hardware requirements:
  #   qwen2.5:1.5b-instruct-q8_0  → ~1.6 GB RAM (CPU) or ~2 GB VRAM (GPU) — recommended
  #   phi4-mini:3.8b-instruct-q4_K_M → ~2.5 GB RAM (CPU) or ~3 GB VRAM (GPU)
  #   llama3.2:3b-instruct-q4_K_M    → ~2.5 GB RAM (CPU) or ~3 GB VRAM (GPU)
  ollama:
    image: ollama/ollama:latest
    container_name: routify-ollama
    ports:
      - "11434:11434"   # expose for local dev tooling (Ollama CLI, Open WebUI, etc.)
    volumes:
      # Persist downloaded models across container restarts.
      # Remove this volume to force a fresh model download.
      - ollama_data:/root/.ollama
    environment:
      # Thread count for CPU inference. Set to number of physical CPU cores.
      # For GPU inference, Ollama auto-detects the GPU; this setting is ignored.
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-4}
      # Keep model loaded between requests (seconds, 0 = forever, -1 = unload immediately)
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [routify]
    # ── GPU support (NVIDIA) — uncomment the block below to enable ────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1          # use 'all' for all available GPUs
    #           capabilities: [gpu]

  dashboard:
    build:
      context: ./routify-dashboard
      dockerfile: Dockerfile
    container_name: routify-dashboard
    ports:
      - "3000:80"
    depends_on:
      admin-api:
        condition: service_healthy
    networks: [routify]

networks:
  routify:
    driver: bridge

volumes:
  ollama_data:
    driver: local

