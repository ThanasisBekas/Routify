# Phase 6.4: API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routify-gateway
  namespace: routify
  labels:
    app: routify-gateway
    app.kubernetes.io/part-of: routify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: routify-gateway
  template:
    metadata:
      labels:
        app: routify-gateway
    spec:
      containers:
        - name: gateway
          image: routify/api-gateway:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9080
              name: management
          env:
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: routify-config
                  key: kafka-bootstrap
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: routify-config
                  key: rabbitmq-host
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: routify-secrets
                  key: rabbitmq-password
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: routify-config
                  key: redis-host
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: routify-secrets
                  key: jwt-public-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: routify-gateway
  namespace: routify
spec:
  selector:
    app: routify-gateway
  ports:
    - port: 8080
      targetPort: http
      name: http
    - port: 9080
      targetPort: management
      name: management
  type: ClusterIP

