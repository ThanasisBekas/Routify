# Phase 6.4: HorizontalPodAutoscaler — auto-scale gateway based on CPU utilisation
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: routify-gateway-hpa
  namespace: routify
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: routify-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

