apiVersion: v2
name: routify
description: Routify — Zero-downtime API Gateway Platform
type: application
version: 1.0.0
appVersion: "2.1.0"
home: https://github.com/routify/routify
icon: https://routify.io/logo.png
keywords:
  - api-gateway
  - spring-cloud-gateway
  - multi-tenant
  - kubernetes
maintainers:
  - name: Routify Platform Team
    email: platform@routify.io

dependencies:
  # ─── Infrastructure (optional — disable if using external services) ──────
  - name: postgresql
    version: "16.4.1"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "20.6.2"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: "31.2.0"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: rabbitmq
    version: "15.1.2"
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled

