{{- if .Values.routeService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "routify.routeService.fullname" . }}
  labels:
    {{- include "routify.routeService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.routeService.service.type }}
  ports:
    - port: {{ .Values.routeService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9081
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "routify.routeService.selectorLabels" . | nindent 4 }}
{{- end }}

