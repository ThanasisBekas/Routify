{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "routify.gateway.fullname" . }}
  labels:
    {{- include "routify.gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9080
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "routify.gateway.selectorLabels" . | nindent 4 }}
{{- end }}

