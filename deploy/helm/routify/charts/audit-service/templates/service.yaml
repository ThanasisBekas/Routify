{{- if .Values.auditService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "routify.auditService.fullname" . }}
  labels:
    {{- include "routify.auditService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.auditService.service.type }}
  ports:
    - port: {{ .Values.auditService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9084
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "routify.auditService.selectorLabels" . | nindent 4 }}
{{- end }}

