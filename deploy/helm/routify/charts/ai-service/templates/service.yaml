{{- if .Values.aiService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "routify.aiService.fullname" . }}
  labels:
    {{- include "routify.aiService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.aiService.service.type }}
  ports:
    - port: {{ .Values.aiService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9086
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "routify.aiService.selectorLabels" . | nindent 4 }}
{{- end }}

