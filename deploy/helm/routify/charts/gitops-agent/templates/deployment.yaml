{{- if .Values.gitopsAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "routify.gitopsAgent.fullname" . }}
  labels:
    {{- include "routify.gitopsAgent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gitopsAgent.replicas }}
  selector:
    matchLabels:
      {{- include "routify.gitopsAgent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "routify.gitopsAgent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gitops-agent
          image: {{ include "routify.image" (dict "global" .Values.global "image" .Values.gitopsAgent.image) }}
          imagePullPolicy: {{ .Values.gitopsAgent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP
            - name: management
              containerPort: 9087
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gitopsAgent.resources | nindent 12 }}
          env:
            {{- include "routify.redisEnv" . | nindent 12 }}
            {{- range $key, $value := .Values.gitopsAgent.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
{{- end }}

