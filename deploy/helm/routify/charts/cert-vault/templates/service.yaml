{{- if .Values.certVault.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "routify.certVault.fullname" . }}
  labels:
    {{- include "routify.certVault.labels" . | nindent 4 }}
spec:
  type: {{ .Values.certVault.service.type }}
  ports:
    - port: {{ .Values.certVault.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9085
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "routify.certVault.selectorLabels" . | nindent 4 }}
{{- end }}

