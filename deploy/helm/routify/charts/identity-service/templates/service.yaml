{{- if .Values.identityService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "routify.identityService.fullname" . }}
  labels:
    {{- include "routify.identityService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.identityService.service.type }}
  ports:
    - port: {{ .Values.identityService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9083
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "routify.identityService.selectorLabels" . | nindent 4 }}
{{- end }}

