# ─── Grafana Tempo — Distributed Tracing Backend ────────────────────────────
# Receives OTLP spans from all Routify services and stores them locally.
# Grafana connects to the query frontend on port 3200.
#
# For production, replace the local backend with S3/GCS/Azure blob storage.
# See: https://grafana.com/docs/tempo/latest/configuration/

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 72h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal

