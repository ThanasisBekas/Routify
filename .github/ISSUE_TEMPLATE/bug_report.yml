name: 🐛 Bug Report
description: Report a bug in the Routify platform
labels: ["bug"]
body:
  - type: dropdown
    id: service
    attributes:
      label: Affected Service
      options:
        - routify-dashboard
        - routify-admin-api
        - routify-api-gateway
        - routify-route-service
        - routify-identity-service
        - routify-audit-service
        - routify-cert-vault
        - routify-ai-service
        - routify-common
        - Infrastructure (Docker / Kafka / RabbitMQ / Redis)
        - CI / GitHub Actions
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Navigate to ...
        2. Click on ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages, stack traces, or screenshots.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Logs, correlation IDs, environment details, or anything else relevant.
    validations:
      required: false

