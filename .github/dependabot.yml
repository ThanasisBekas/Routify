# Dependabot — automated dependency update PRs
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  # ── Maven (Java backend) ──────────────────────────────────────────────────
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns: ["org.springframework.boot:*", "org.springframework:*"]
      spring-cloud:
        patterns: ["org.springframework.cloud:*"]
      spring-ai:
        patterns: ["org.springframework.ai:*"]
      testing:
        patterns: ["org.testcontainers:*", "com.github.docker-java:*"]
    labels:
      - dependencies
      - java

  # ── npm (React dashboard) ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /routify-dashboard
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      testing:
        patterns: ["vitest", "@testing-library/*", "@playwright/test", "happy-dom"]
      linting:
        patterns: ["eslint*", "prettier*", "typescript-eslint"]
    labels:
      - dependencies
      - frontend

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

