name: Develop Build Validation

on:
  push:
    branches: [develop]

concurrency:
  group: build-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  backend-compile:
    name: Backend Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Compile all modules
        run: mvn compile -T 4 -B -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routify-dashboard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: routify-dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

