name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version component to bump'
        required: true
        type: choice
        default: 'major'
        options:
          - major
          - minor

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump ${{ inputs.bump_type }} Version on Develop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: routify-dashboard/package-lock.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect current and next version
        id: version
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "current_version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${CURRENT}"

          # Extract major.minor.patch from e.g. 2.0.0-SNAPSHOT
          BASE="${CURRENT%%-*}"
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)

          BUMP_TYPE="${{ inputs.bump_type }}"

          if [ "$BUMP_TYPE" = "major" ]; then
            NEXT_MAJOR=$((MAJOR + 1))
            NEXT_VERSION="${NEXT_MAJOR}.0.0-SNAPSHOT"
          elif [ "$BUMP_TYPE" = "minor" ]; then
            NEXT_MINOR=$((MINOR + 1))
            NEXT_VERSION="${MAJOR}.${NEXT_MINOR}.0-SNAPSHOT"
          fi

          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT_VERSION}"

      - name: Update Maven versions
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.next_version }} \
            -DgenerateBackupPoms=false \
            -B -q

      - name: Update dashboard version
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('routify-dashboard/package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.next_version }}';
            fs.writeFileSync('routify-dashboard/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit and create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUMP_BRANCH="chore/bump-${{ inputs.bump_type }}-to-${{ steps.version.outputs.next_version }}"
          git checkout -b "${BUMP_BRANCH}"

          git add -A
          git commit -m "chore: bump ${{ inputs.bump_type }} version ${{ steps.version.outputs.current_version }} → ${{ steps.version.outputs.next_version }}"
          git push origin "${BUMP_BRANCH}"

          # Ensure the 'chore' label exists (no-op if already present)
          gh label create "chore" --description "Chore / maintenance PRs" --color "C5DEF5" 2>/dev/null || true

          PR_URL=$(gh pr create \
            --base develop \
            --head "${BUMP_BRANCH}" \
            --title "chore: bump ${{ inputs.bump_type }} version to ${{ steps.version.outputs.next_version }}" \
            --body "Automated ${{ inputs.bump_type }} version bump.

          - Previous: \`${{ steps.version.outputs.current_version }}\`
          - New: \`${{ steps.version.outputs.next_version }}\`

          ---
          *Triggered by bump-version workflow run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" \
            --label "chore")

          echo "Created PR: ${PR_URL}"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### ${{ inputs.bump_type == 'major' && 'Major' || 'Minor' }} Version Bump PR Created :arrow_up:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bump type | \`${{ inputs.bump_type }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous | \`${{ steps.version.outputs.current_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| New | \`${{ steps.version.outputs.next_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | \`develop\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **Next step:** Review and merge the PR to apply the version bump." >> "$GITHUB_STEP_SUMMARY"
