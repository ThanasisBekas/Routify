# Routify CI Pipeline
# Runs on every push to master/develop and on every PR.
# Four parallel jobs (after change detection):
#   - backend-build  : compile all Maven modules (no tests — fast gate)
#   - backend-test   : run unit/integration tests for changed Java modules
#   - frontend       : npm lint + test + build for the dashboard

name: Routify CI

on:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
    branches: [master, develop, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Change detection ──────────────────────────────────────────────────────
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'pom.xml'
              - 'routify-common/**'
              - 'routify-route-service/**'
              - 'routify-identity-service/**'
              - 'routify-admin-api/**'
              - 'routify-api-gateway/**'
              - 'routify-audit-service/**'
              - 'routify-cert-vault/**'
              - 'routify-ai-service/**'
            frontend:
              - 'routify-dashboard/**'

  # ── Backend Build (compile only — fast gate) ─────────────────────────────
  backend-build:
    name: Backend Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Compile all modules
        run: mvn clean package -T 4 -B -DskipTests

  # ── Backend Tests (unit + integration) ───────────────────────────────────
  backend-test:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build & Test
        run: mvn clean verify -T 4 -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  # ── Frontend Build & Lint ────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routify-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('routify-dashboard/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
