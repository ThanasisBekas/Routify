# Routify CI Pipeline
# Runs on every push to master/develop and on every PR.
# Jobs (after change detection):
#   - backend-build  : compile all Maven modules (no tests — fast gate)
#   - backend-test   : run unit tests for changed Java modules
#   - frontend       : npm typecheck + lint + test + build + E2E

name: Routify CI

on:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
    branches: [master, develop, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Change detection ──────────────────────────────────────────────────────
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'pom.xml'
              - 'routify-common/**'
              - 'routify-route-service/**'
              - 'routify-identity-service/**'
              - 'routify-admin-api/**'
              - 'routify-api-gateway/**'
              - 'routify-audit-service/**'
              - 'routify-cert-vault/**'
              - 'routify-ai-service/**'
              - 'org/**'
            frontend:
              - 'routify-dashboard/**'

  # ── Backend Build (compile only — fast gate) ─────────────────────────────
  backend-build:
    name: Backend Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Compile all modules
        run: mvn clean package -T 4 -B -DskipTests

  # ── Backend Unit Tests ────────────────────────────────────────────────────
  # Note: Integration tests (*IT.java) are disabled globally via <skipITs>true</skipITs>
  # in the parent POM due to Docker Engine 29.x / Testcontainers incompatibility.
  # Re-enable manually with: mvn verify -DskipITs=false
  backend-test:
    name: Backend Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Run unit tests
        run: mvn clean verify -T 4 -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # ── Frontend Build, Lint & Test ───────────────────────────────────────────
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routify-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: routify-dashboard/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: routify-dashboard/playwright-report/
          retention-days: 7

