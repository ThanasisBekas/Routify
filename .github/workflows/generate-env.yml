# Routify — Generate .env
#
# Generates a .env file with fresh credentials and uploads it as a
# downloadable workflow artifact. The file is NOT committed to the repository.
#
# Download the artifact from the workflow run's Summary page.
# Artifacts are retained for 1 day — download promptly.
#
# Credentials generated fresh on every run:
#   - DB_PASS                   — 24-byte random, alphanumeric
#   - RABBITMQ_PASS             — 24-byte random, alphanumeric
#   - REDIS_PASS                — 24-byte random, alphanumeric
#   - ADMIN_INITIAL_PASSWORD    — 16-byte random, hex
#   - GRAFANA_PASSWORD          — 16-byte random, hex
#   - CERT_VAULT_ENCRYPTION_KEY — 32-byte random AES key, base64
#   - FIELD_ENCRYPTION_KEY      — 32-byte random AES key, base64 (@Sensitive field encryption)
#   - JWT_PRIVATE_KEY            — fresh RSA-2048 private key (PKCS8 DER, base64)
#   - JWT_PUBLIC_KEY             — matching RSA-2048 public key (SPKI DER, base64)
#
# Required repository secret:
#   OPENAI_API_KEY  — shared OpenAI key; sourced as-is, never rotated here.
#
# Usage:
#   Actions → "Generate .env" → Run workflow
#   Then download the artifact from the completed run's Summary page.

name: Generate .env

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-env
  cancel-in-progress: false

jobs:
  generate:
    name: Generate .env
    runs-on: ubuntu-latest

    steps:
      # ── Generate credentials & write .env in a single step ──────────────────
      # All generation + file writing happens in one step so that secrets
      # never pass through GITHUB_OUTPUT (where ::add-mask:: would corrupt them).

      - name: Generate credentials and write .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          # ── Simple random strings ────────────────────────────────────────────
          DB_PASS=$(openssl rand -base64 24 | tr -d '=+/' | head -c 32)
          RABBITMQ_PASS=$(openssl rand -base64 24 | tr -d '=+/' | head -c 32)
          REDIS_PASS=$(openssl rand -base64 24 | tr -d '=+/' | head -c 32)
          ADMIN_INITIAL_PASSWORD=$(openssl rand -hex 16)
          GRAFANA_PASSWORD=$(openssl rand -hex 16)

          # ── AES-256 key for cert-vault (32 raw bytes → standard base64) ──────
          CERT_VAULT_ENCRYPTION_KEY=$(openssl rand -base64 32)

          # ── AES-256 key for @Sensitive field-level encryption ──────────────
          FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)

          # ── RSA-2048 keypair ─────────────────────────────────────────────────
          # PKCS8 DER private key + SPKI DER public key → single-line base64.
          # This is the exact format consumed by every service's application.yml.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/routify_jwt.pem 2>/dev/null

          JWT_PRIVATE_KEY=$(openssl pkcs8 -topk8 -nocrypt -inform PEM \
            -in /tmp/routify_jwt.pem -outform DER | base64 -w 0)

          JWT_PUBLIC_KEY=$(openssl rsa -in /tmp/routify_jwt.pem -pubout \
            -outform DER 2>/dev/null | base64 -w 0)

          rm -f /tmp/routify_jwt.pem

          # ── Write the .env file ──────────────────────────────────────────────
          mkdir -p artifact

          {
            printf '# Routify — environment secrets\n'
            printf '# Auto-generated by the "Generate .env" GitHub Actions workflow.\n'
            printf '# DO NOT edit manually — re-run the workflow to rotate credentials.\n'
            printf '#\n'
            printf '# Workflow run  : %s\n' "${{ github.run_id }}"
            printf '# Generated at  : %s\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            printf '\n'
            printf 'DB_PASS=%s\n'                   "${DB_PASS}"
            printf 'RABBITMQ_PASS=%s\n'             "${RABBITMQ_PASS}"
            printf 'REDIS_PASS=%s\n'                "${REDIS_PASS}"
            printf 'JWT_PRIVATE_KEY=%s\n'           "${JWT_PRIVATE_KEY}"
            printf 'JWT_PUBLIC_KEY=%s\n'            "${JWT_PUBLIC_KEY}"
            printf 'CERT_VAULT_ENCRYPTION_KEY=%s\n' "${CERT_VAULT_ENCRYPTION_KEY}"
            printf 'FIELD_ENCRYPTION_KEY=%s\n'      "${FIELD_ENCRYPTION_KEY}"
            printf 'ADMIN_INITIAL_PASSWORD=%s\n'    "${ADMIN_INITIAL_PASSWORD}"
            printf 'GRAFANA_PASSWORD=%s\n'          "${GRAFANA_PASSWORD}"
            printf 'OPENAI_API_KEY=%s\n'            "${OPENAI_API_KEY}"
          } > "artifact/.env"

          # ── Mask secrets AFTER the file is written ───────────────────────────
          echo "::add-mask::${DB_PASS}"
          echo "::add-mask::${RABBITMQ_PASS}"
          echo "::add-mask::${REDIS_PASS}"
          echo "::add-mask::${ADMIN_INITIAL_PASSWORD}"
          echo "::add-mask::${GRAFANA_PASSWORD}"
          echo "::add-mask::${CERT_VAULT_ENCRYPTION_KEY}"
          echo "::add-mask::${FIELD_ENCRYPTION_KEY}"
          echo "::add-mask::${JWT_PRIVATE_KEY}"
          echo "::add-mask::${JWT_PUBLIC_KEY}"

          # Verify the file was created
          echo "::notice::artifact/.env created ($(wc -c < artifact/.env) bytes)"

      # ── Upload as downloadable artifact ──────────────────────────────────────

      - name: Upload .env artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-file
          path: artifact/.env
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      # ── Summary ──────────────────────────────────────────────────────────────

      - name: Summary
        run: |
          echo "### .env Generated :key:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variable | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`DB_PASS\` | ✅ rotated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`RABBITMQ_PASS\` | ✅ rotated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`REDIS_PASS\` | ✅ rotated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`JWT_PRIVATE_KEY\` | ✅ rotated (RSA-2048) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`JWT_PUBLIC_KEY\` | ✅ rotated (RSA-2048) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`CERT_VAULT_ENCRYPTION_KEY\` | ✅ rotated (AES-256) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`FIELD_ENCRYPTION_KEY\` | ✅ rotated (AES-256) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`ADMIN_INITIAL_PASSWORD\` | ✅ rotated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`GRAFANA_PASSWORD\` | ✅ rotated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`OPENAI_API_KEY\` | 🔒 from repository secret (not rotated) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | \`.env\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Download | 📦 Available as artifact — see **Artifacts** section below |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Retention | 1 day — download promptly |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | \`${{ github.run_id }}\` |" >> "$GITHUB_STEP_SUMMARY"

