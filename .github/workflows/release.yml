name: Release

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Release number (e.g. 123 creates branch release/123 and version X.Y.123 based on the current POM major.minor)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release Branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        run: |
          if ! [[ "${{ inputs.release_number }}" =~ ^[0-9]+$ ]]; then
            echo "::error::Release number must be a positive integer (e.g. 123)"
            exit 1
          fi

      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: routify-dashboard/package-lock.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive release version from POM
        id: version
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "current_version=${CURRENT}" >> "$GITHUB_OUTPUT"

          # Extract major.minor from current version (e.g. 2.0.0-SNAPSHOT → 2.0)
          BASE="${CURRENT%%-*}"
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)

          RELEASE_VERSION="${MAJOR}.${MINOR}.${{ inputs.release_number }}"
          NEXT_SNAPSHOT="${RELEASE_VERSION}-SNAPSHOT"

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=${NEXT_SNAPSHOT}"      >> "$GITHUB_OUTPUT"
          echo "Current: ${CURRENT} → Release: ${RELEASE_VERSION} → Next develop: ${NEXT_SNAPSHOT}"

      - name: Create release branch
        run: git checkout -b "release/${{ inputs.release_number }}"

      - name: Update Maven versions
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.release_version }} \
            -DgenerateBackupPoms=false \
            -B -q

      - name: Update dashboard version
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('routify-dashboard/package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.release_version }}';
            fs.writeFileSync('routify-dashboard/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "release: bump version to ${{ steps.version.outputs.release_version }}"

      - name: Push release branch
        run: git push origin "release/${{ inputs.release_number }}"

      - name: Bump develop to next SNAPSHOT
        run: |
          git checkout develop

          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.next_snapshot }} \
            -DgenerateBackupPoms=false \
            -B -q

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('routify-dashboard/package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.next_snapshot }}';
            fs.writeFileSync('routify-dashboard/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          git add -A
          git commit -m "chore: bump develop to ${{ steps.version.outputs.next_snapshot }} after release/${{ inputs.release_number }}"
          git push origin develop

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          target_commitish: release/${{ inputs.release_number }}
          name: Routify v${{ steps.version.outputs.release_version }}
          draft: true
          generate_release_notes: true

      - name: Summary
        run: |
          echo "### Release Created :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`release/${{ inputs.release_number }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.release_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous | \`${{ steps.version.outputs.current_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Develop | \`${{ steps.version.outputs.next_snapshot }}\` |" >> "$GITHUB_STEP_SUMMARY"
