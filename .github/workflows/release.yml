name: Release

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Release number (e.g. 123 creates branch release/123 and version 1.0.123)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release Branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        run: |
          if ! [[ "${{ inputs.release_number }}" =~ ^[0-9]+$ ]]; then
            echo "::error::Release number must be a positive integer (e.g. 123)"
            exit 1
          fi

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: routify-dashboard/package-lock.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        id: version
        run: |
          RELEASE_VERSION="1.0.${{ inputs.release_number }}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${RELEASE_VERSION}"

      - name: Create release branch
        run: git checkout -b "release/${{ inputs.release_number }}"

      - name: Update Maven versions
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.release_version }} \
            -DgenerateBackupPoms=false \
            -B -q

      - name: Update dashboard version
        working-directory: routify-dashboard
        run: npm version ${{ steps.version.outputs.release_version }} --no-git-tag-version

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "release: bump version to ${{ steps.version.outputs.release_version }}"

      - name: Push release branch
        run: git push origin "release/${{ inputs.release_number }}"

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          target_commitish: release/${{ inputs.release_number }}
          name: Routify v${{ steps.version.outputs.release_version }}
          draft: true
          generate_release_notes: true

      - name: Summary
        run: |
          echo "### Release Created :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`release/${{ inputs.release_number }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.release_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | \`develop\` @ \`$(git rev-parse --short HEAD~1)\` |" >> "$GITHUB_STEP_SUMMARY"

