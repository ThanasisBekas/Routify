name: Promote Release to Master

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Release number to promote (e.g. 123 merges release/123 into master)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Merge Release into Master
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        run: |
          if ! [[ "${{ inputs.release_number }}" =~ ^[0-9]+$ ]]; then
            echo "::error::Release number must be a positive integer (e.g. 123)"
            exit 1
          fi

      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify release branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin "release/${{ inputs.release_number }}"; then
            echo "::error::Branch release/${{ inputs.release_number }} does not exist on remote"
            exit 1
          fi

      - name: Fetch release branch
        run: git fetch origin "release/${{ inputs.release_number }}"

      - name: Read release version from branch POM
        id: version
        run: |
          # Read the project version from the release branch's POM without switching branches.
          # We must skip <parent><version> (Spring Boot) and find the project's own <version>.
          # Strategy: extract the first <version> tag that appears AFTER </parent>.
          RELEASE_VERSION=$(git show "origin/release/${{ inputs.release_number }}:pom.xml" \
            | sed -n '/<\/parent>/,$ p' \
            | grep -m1 '<version>' \
            | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::Could not extract project version from release/${{ inputs.release_number }} pom.xml"
            exit 1
          fi
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${RELEASE_VERSION}"

      - name: Merge release into master
        run: |
          git merge \
            --no-ff \
            "origin/release/${{ inputs.release_number }}" \
            -m "release: merge release/${{ inputs.release_number }} (v${{ steps.version.outputs.release_version }}) into master"

      - name: Push master
        run: git push origin master

      - name: Tag release
        run: |
          git tag -a "v${{ steps.version.outputs.release_version }}" \
            -m "Release v${{ steps.version.outputs.release_version }}"
          git push origin "v${{ steps.version.outputs.release_version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: Routify v${{ steps.version.outputs.release_version }}
          draft: false
          generate_release_notes: true

      - name: Back-merge master into develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge master -m "chore: back-merge master into develop after release/${{ inputs.release_number }}"
          git push origin develop

      - name: Delete release branch
        run: git push origin --delete "release/${{ inputs.release_number }}"

      - name: Summary
        run: |
          echo "### Release Promoted :ship:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`v${{ steps.version.outputs.release_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Merged | \`release/${{ inputs.release_number }}\` → \`master\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`v${{ steps.version.outputs.release_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Back-merged | \`master\` → \`develop\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cleanup | \`release/${{ inputs.release_number }}\` branch deleted |" >> "$GITHUB_STEP_SUMMARY"
