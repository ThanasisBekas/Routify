name: Bump Major Version

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump Major Version on Develop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: routify-dashboard/package-lock.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect current and next version
        id: version
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "current_version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${CURRENT}"

          # Extract major.minor.patch from e.g. 2.0.0-SNAPSHOT
          BASE="${CURRENT%%-*}"
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)

          NEXT_MAJOR=$((MAJOR + 1))
          NEXT_VERSION="${NEXT_MAJOR}.${MINOR}.0-SNAPSHOT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT_VERSION}"

      - name: Update Maven versions
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.next_version }} \
            -DgenerateBackupPoms=false \
            -B -q

      - name: Update dashboard version
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('routify-dashboard/package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.next_version }}';
            fs.writeFileSync('routify-dashboard/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "chore: bump major version ${{ steps.version.outputs.current_version }} → ${{ steps.version.outputs.next_version }}"

      - name: Push develop
        run: git push origin develop

      - name: Summary
        run: |
          echo "### Major Version Bumped :arrow_up:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous | \`${{ steps.version.outputs.current_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| New | \`${{ steps.version.outputs.next_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`develop\` |" >> "$GITHUB_STEP_SUMMARY"

