spring:
  application:
    name: routify-api-gateway

  threads:
    virtual:
      enabled: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration

  # Config Server not yet implemented — re-enable this import when the
  # routify-config-server module is introduced (see TECHNICAL_ANALYSIS §5.2 / §6.5).
  config:
    import: "optional:configserver:"
  # config:
  #   import: "optional:configserver:http://${CONFIG_SERVER_USERNAME:configserver}:${CONFIG_SERVER_PASSWORD:configserver_dev_pass}@${CONFIG_SERVER_HOST:localhost}:8888"

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms
      # No default — must be supplied via REDIS_PASS environment variable.
      password: ${REDIS_PASS:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: routify-gateway
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  # ─── RabbitMQ — sync request/reply (snapshot fetch + status serving) ────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:routify}
    # No default — must be supplied via RABBITMQ_PASS environment variable.
    password: ${RABBITMQ_PASS:}
    virtual-host: /
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        prefetch: 5

  # ─── Spring Cloud Gateway Routes ──────────────────────────────────────────
  cloud:
    gateway:
      # ALL routes are configured exclusively through the Routify dashboard.
      # There are no static routes defined here.
      #
      # Routes are stored in routify-route-service (PostgreSQL) and loaded into
      # the gateway at startup and on every change via:
      #   - Startup: DynamicRouteDefinitionLocator fetches snapshot via RabbitMQ
      #   - Changes: DynamicRouteRefreshListener consumes Kafka GATEWAY_RELOAD events
      #
      # To configure routes (including admin-api, auth, websocket, external APIs):
      #   → open the Routify dashboard → Routes section

      default-filters:
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers
            strategy: RETAIN_UNIQUE

      # CORS is handled by Spring Security CorsConfigurationSource bean
      # in GatewaySecurityConfig — no globalcors needed here.


server:
  port: 8080
  shutdown: graceful

# ─── Actuator / Management ─────────────────────────────────────────────────
management:
  server:
    port: 9080
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

routify:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}

  # ─── Startup secret validation ────────────────────────────────────────────────
  # NOTE: JWT_PUBLIC_KEY is intentionally NOT in this list — in dev mode the gateway
  # falls back to ephemeral key validation (acceptable for local development only).
  # Add it here when deploying to staging/production environments.
  required-secrets: >-
    spring.rabbitmq.password,
    spring.data.redis.password

resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 100
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
      # Backward-compat alias — routes configured before name standardisation may still
      # reference "default-cb". GatewayResilienceConfigApplier updates both at runtime.
      default-cb:
        sliding-window-size: 100
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      default:
        timeout-duration: 10s
        cancel-running-future: true
      # Backward-compat alias (see above)
      default-cb:
        timeout-duration: 10s
        cancel-running-future: true


# ─── Client ID Mapping ───────────────────────────────────────────────────────
# Maps organisation names to client ID values for the ClientIdAuth filter.
#
# Example:
# client:
#   client-id-mapping:
#     my-org: f3b10990-02b9-499e-8713-aa884c30fa99
client:
  client-id-mapping: {}

# ─── Auth Providers ──────────────────────────────────────────────────────────
# OAuth2 token acquisition + Bearer token verification providers.
#
# auth.oauth2.<name>: token acquisition (password grant / client-credentials)
# auth.oauth2Verification.<name>: token introspection (verification)
# auth.basic.<name>: basic auth credentials for downstream injection
#
# Example:
# auth:
#   basic:
#     my-downstream:
#       username: svc-user
#       password: secret
#   oauth2:
#     my-provider:
#       uri: https://auth.example.com/oauth/token
#       client-id: gateway-client
#       client-secret: secret
#       scope: read
#   oauth2Verification:
#     my-provider:
#       uri: https://auth.example.com/oauth/introspect
#       parameter-style: BODY
#       parameter-name: token
auth:
  basic: {}
  oauth2: {}
  oauth2Verification: {}



logging:
  level:
    gr.routify: DEBUG
    gr.routify.gateway.certificate: INFO
    gr.routify.gateway.downstream: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    org.springframework.cloud.gateway.filter.factory.RequestRateLimiterGatewayFilterFactory: DEBUG
    org.springframework.kafka: WARN
    com.github.benmanes.caffeine: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{correlationId}] [tenant=%X{tenantId}] [user=%X{userId}] %logger{36} - %msg%n"
