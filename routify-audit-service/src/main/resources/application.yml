spring:
  application:
    name: routify-audit-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:routify}
    username: ${DB_USER:routify}
    # No default — must be supplied via DB_PASS environment variable.
    password: ${DB_PASS:}
    hikari:
      # Sized for 3 concurrent Kafka consumer threads doing batch inserts
      # + RabbitMQ query handlers + replay service connections.
      # Previous value (10) could saturate under telemetry spikes.
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 10000
      pool-name: audit-pool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: routify_audit
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: routify_audit
    default-schema: routify_audit

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: routify-audit
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  # ─── RabbitMQ — on platform bus ─────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:routify}
    # No default — must be supplied via RABBITMQ_PASS environment variable.
    password: ${RABBITMQ_PASS:}
    virtual-host: /

server:
  port: 8084
  shutdown: graceful

# ─── Actuator / Management ─────────────────────────────────────────────────
management:
  server:
    port: 9084
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

routify:
  audit:
    retention:
      # ─── Retention periods per table (days) ──────────────────────────────────
      request-log-days: ${AUDIT_RETENTION_REQUEST_LOG_DAYS:30}
      audit-log-days: ${AUDIT_RETENTION_AUDIT_LOG_DAYS:90}
      dlq-log-days: ${AUDIT_RETENTION_DLQ_LOG_DAYS:30}
      ai-filter-decision-days: ${AUDIT_RETENTION_AI_FILTER_DAYS:60}
      ai-modifier-decision-days: ${AUDIT_RETENTION_AI_MODIFIER_DAYS:60}
      alert-event-days: ${AUDIT_RETENTION_ALERT_EVENT_DAYS:90}
      usage-daily-days: ${AUDIT_RETENTION_USAGE_DAILY_DAYS:365}
      # ─── Batch deletion settings ─────────────────────────────────────────────
      batch-size: ${AUDIT_RETENTION_BATCH_SIZE:1000}
      cron: "0 0 2 * * *"
  replay:
    # Base URL of the API gateway — replays are sent here so the full filter chain is re-applied.
    # Override with ROUTIFY_REPLAY_GATEWAY_BASE_URL env var in production (e.g. http://routify-api-gateway:8080).
    gateway-base-url: ${ROUTIFY_REPLAY_GATEWAY_BASE_URL:http://localhost:8080}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    scheduler:
      enabled: false
      interval-ms: 600000   # 10 minutes
      batch-size: 20
      min-age-minutes: 5
      max-attempts: 5

  # ─── Startup secret validation ────────────────────────────────────────────────
  required-secrets: >-
    spring.datasource.password,
    spring.rabbitmq.password



logging:
  level:
    io.routify: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{correlationId}] [tenant=%X{tenantId}] [user=%X{userId}] %logger{36} - %msg%n"
