spring:
  application:
    name: routify-audit-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:routify}
    username: ${DB_USER:routify}
    # No default — must be supplied via DB_PASS environment variable.
    password: ${DB_PASS:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: routify_audit
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: routify_audit
    default-schema: routify_audit

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: routify-audit
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  # ─── RabbitMQ — on platform bus ─────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:routify}
    # No default — must be supplied via RABBITMQ_PASS environment variable.
    password: ${RABBITMQ_PASS:}
    virtual-host: /

server:
  port: 8084
  shutdown: graceful

# ─── Actuator / Management ─────────────────────────────────────────────────
management:
  server:
    port: 9084
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

routify:
  audit:
    retention:
      request-log-days: 30
      audit-log-days: 7
      dlq-log-days: 7
      cron: "0 0 2 * * *"
  replay:
    # Base URL of the API gateway — replays are sent here so the full filter chain is re-applied.
    # Override with ROUTIFY_REPLAY_GATEWAY_BASE_URL env var in production (e.g. http://routify-api-gateway:8080).
    gateway-base-url: ${ROUTIFY_REPLAY_GATEWAY_BASE_URL:http://localhost:8080}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    scheduler:
      enabled: false
      interval-ms: 600000   # 10 minutes
      batch-size: 20
      min-age-minutes: 5
      max-attempts: 5

  # ─── Startup secret validation ────────────────────────────────────────────────
  required-secrets: >-
    spring.datasource.password,
    spring.rabbitmq.password



logging:
  level:
    gr.routify: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
