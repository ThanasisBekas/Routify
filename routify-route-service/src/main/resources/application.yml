spring:
  application:
    name: routify-route-service

  threads:
    virtual:
      enabled: true   # Java 21 Virtual Threads via Tomcat

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:routify}
    username: ${DB_USER:routify}
    # No default — must be supplied via DB_PASS environment variable.
    password: ${DB_PASS:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: route-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: routify
        format_sql: false
        jdbc:
          batch_size: 50
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: routify
    default-schema: routify
    baseline-on-migrate: false
    validate-on-migrate: true
    connect-retries: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # No default — must be supplied via REDIS_PASS environment variable.
      password: ${REDIS_PASS:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

  # ─── RabbitMQ — sync request/reply responder ────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:routify}
    # No default — must be supplied via RABBITMQ_PASS environment variable.
    password: ${RABBITMQ_PASS:}
    virtual-host: /
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 10

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8081
  shutdown: graceful

# ─── Actuator / Management ─────────────────────────────────────────────────
management:
  server:
    port: 9081
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ─── Routify Configuration ───────────────────────────────────────────────────
routify:
  outbox:
    # Primary wake-up is via PostgreSQL LISTEN/NOTIFY (OutboxNotifyListener).
    # This scheduled interval is a safety-net fallback only — catches any
    # notifications missed due to connection drops or edge cases.
    poll-interval-ms: 5000
    retry-interval-ms: 30000
    batch-size: 50
    retry-batch-size: 50   # C6/M9: configurable retry batch (was hardcoded 5)
    max-retries: 5
    notify:
      enabled: true   # PostgreSQL LISTEN/NOTIFY for on-demand outbox wake-up

  jwt:
    # RSA public key for validating inter-service JWTs (issued by routify-identity-service)
    public-key: ${JWT_PUBLIC_KEY:}

  # ─── Startup secret validation ────────────────────────────────────────────────
  required-secrets: >-
    spring.datasource.password,
    spring.rabbitmq.password,
    spring.data.redis.password



logging:
  level:
    gr.routify: DEBUG
    org.springframework.kafka: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{correlationId}] [tenant=%X{tenantId}] [user=%X{userId}] %logger{36} - %msg%n"

