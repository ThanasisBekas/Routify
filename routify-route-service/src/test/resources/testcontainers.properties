# Testcontainers configuration for routify-route-service integration tests.
# On CI (GitHub Actions), Docker is available natively.
# On local dev, Docker Desktop must be installed and running.
#
# If you encounter "Could not find a valid Docker environment" errors on macOS
# with Docker Desktop 4.67+ (Docker Engine 29.x), this is a known incompatibility
# between docker-java and the new Docker API version. Workarounds:
#   1. Downgrade Docker Desktop to 4.36.x or earlier
#   2. Wait for a Testcontainers release with docker-java >= 3.6.0
#   3. Run tests in a CI environment (GitHub Actions works out of the box)
#
# Ryuk (container cleanup) is enabled by default. Disable on CI if resource
# reaper is handled externally:
#   testcontainers.reuse.enable=false

