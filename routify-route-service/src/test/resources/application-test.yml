# ─── Test profile overrides for routify-route-service integration tests ──────
# Testcontainers dynamically injects datasource, Kafka, and RabbitMQ properties
# via @DynamicPropertySource. This file handles everything else.

spring:
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway runs first — same as production

  flyway:
    enabled: true
    clean-disabled: false

  # Redis is not needed for the command→outbox→event flow under test.
  # Exclude auto-config to avoid connection failures.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ─── Outbox tuning for deterministic test control ──────────────────────────────
routify:
  outbox:
    # Prevent the @Scheduled poller from running automatically.
    # Tests call outboxPoller.pollAndPublish() directly for deterministic assertions.
    poll-interval-ms: 999999999
    retry-interval-ms: 999999999
    batch-size: 50
    max-retries: 5
    notify:
      enabled: false   # Disable PG LISTEN/NOTIFY listener thread in tests

  # Bypass SecretValidator startup check — no real secrets in test env
  required-secrets:

  jwt:
    public-key:

# ─── Actuator ──────────────────────────────────────────────────────────────────
management:
  server:
    port: 0   # Random port to avoid conflicts with parallel test runs

server:
  port: 0   # Random port

# ─── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    gr.routify: DEBUG
    org.testcontainers: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN

