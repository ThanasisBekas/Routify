server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (skip responses smaller than 256 bytes)
    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────

    # Prevent click-jacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Limit referrer information
    add_header Referrer-Policy "no-referrer" always;

    # Content Security Policy
    # 'self' for scripts/styles/images/fonts; wss: for WebSocket to admin-api;
    # data: for inline SVG / base64 icons used by UI libraries.
    # Vite production builds use hashed filenames — no inline scripts needed.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
        always;

    # HTTP Strict Transport Security (1 year, include subdomains, allow preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Restrict browser features the dashboard does not need
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
        always;

    # ── Locations ─────────────────────────────────────────────────────────────

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache TTL (Vite adds content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

