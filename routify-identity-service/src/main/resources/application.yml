spring:
  application:
    name: routify-identity-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:routify}
    username: ${DB_USER:routify}
    # No default — must be supplied via DB_PASS environment variable.
    password: ${DB_PASS:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      pool-name: identity-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: routify_identity
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: routify_identity
    default-schema: routify_identity
    baseline-on-migrate: true
    # Admin user is seeded programmatically by DataSeeder.
    # Provide ADMIN_INITIAL_PASSWORD env var to set a known password on first boot.
    # If the env var is absent, a random password is printed to stdout once.

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # No default — must be supplied via REDIS_PASS environment variable.
      password: ${REDIS_PASS:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  # ─── RabbitMQ — on platform bus (future request/reply expansion) ────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:routify}
    # No default — must be supplied via RABBITMQ_PASS environment variable.
    password: ${RABBITMQ_PASS:}
    virtual-host: /

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8083
  shutdown: graceful

# ─── Actuator / Management ─────────────────────────────────────────────────
management:
  server:
    port: 9083
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

routify:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:3600}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:86400}
    # Set to false in local HTTP dev; must be true in any HTTPS deployment.
    refresh-cookie-secure: ${JWT_COOKIE_SECURE:false}

  seed:
    # Initial admin password. Supply via ADMIN_INITIAL_PASSWORD env var.
    # If blank, a random password is generated and printed to stdout ONCE on first boot.
    # The seeded account is always flagged must_change_password=true.
    admin-password: ${ADMIN_INITIAL_PASSWORD:}

  # ─── Startup secret validation ────────────────────────────────────────────────
  # SecretValidator (registered in RoutifyIdentityServiceApplication) checks these
  # keys are non-blank before the application context finishes loading.
  required-secrets: >-
    spring.datasource.password,
    spring.rabbitmq.password,
    spring.data.redis.password



logging:
  level:
    io.routify: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{correlationId}] [tenant=%X{tenantId}] [user=%X{userId}] %logger{36} - %msg%n"

